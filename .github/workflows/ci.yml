name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group test --group types --extra dev --extra dash
      - run: uv run ruff check src tests
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group test --group types --extra dash
      - name: Run tests (skip real-data integration tests)
        run: |
          uv run pytest \
            --ignore=tests/test_integration_pipeline.py \
            --ignore=tests/test_integration_tsa067.py \
            --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group audit --extra dash
      - run: uv run pip-audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra docs
      - run: uv run mkdocs build --strict

